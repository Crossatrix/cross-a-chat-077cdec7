<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cross Chat - Modern Messaging Platform</title>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "7a8e06f4-420e-4fe0-b714-0dee2944e901",
          notifyButton: {
            enable: true,
          },
          promptOptions: {
            slidedown: {
              prompts: [
                {
                  type: "push",
                  autoPrompt: true,
                  text: {
                    actionMessage: "Enable notifications to receive messages and calls",
                    acceptButton: "Allow",
                    cancelButton: "Maybe Later"
                  },
                  delay: {
                    pageViews: 1,
                    timeDelay: 3
                  }
                }
              ]
            }
          }
        });
      });
    </script>
    <meta name="description" content="Connect instantly with Cross Chat - A sleek, real-time messaging platform for seamless communication" />
